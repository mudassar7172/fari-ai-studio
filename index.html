<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fari AI Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b141a;color:#fff;min-height:100vh}
.top{padding:12px;text-align:center;background:#111b21;border-bottom:1px solid #2a3942}
.top b{font-size:18px}
.card{max-width:520px;margin:14px auto;background:#202c33;border-radius:14px;padding:14px;border:1px solid #2a3942}
.darea{width:100%;min-height:420px;background:#111b21;border-radius:12px;border:2px solid #00a884;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.dimg{width:100%;height:auto;max-height:620px;object-fit:contain;display:block}
.ph{padding:20px;text-align:center;color:#888;font-size:13px}
.lab{background:#00a884;padding:12px;border-radius:10px;display:block;text-align:center;cursor:pointer;font-weight:700;margin-bottom:12px}
input[type=file]{position:absolute;opacity:0.01;width:1px;height:1px}
textarea{width:100%;padding:12px;border-radius:10px;background:#111b21;color:#fff;border:1px solid #2a3942;min-height:90px;font-size:14px;resize:none}
.btn{border:none;padding:15px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer;font-weight:800;font-size:15px;background:#00a884;color:#fff}
.mic{position:fixed;right:16px;bottom:16px;width:60px;height:60px;border-radius:50%;background:#00a884;border:2px solid #fff;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.spin{width:36px;height:36px;border:3px solid #2a3942;border-top:3px solid #00a884;border-radius:50%;animation:s 1s linear infinite} @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><b>Fari AI Studio</b></div>

<div class="card">
<label for="gal" class="lab">📷 Gallery</label>
<input type="file" id="gal" accept="image/*">

<div class="darea" id="da">
<div id="ph" class="ph">Display - Jo generate karoge yahan ayega - Real skin - Fari ke naam se</div>
<img id="di" class="dimg" style="display:none">
<div id="sp" style="display:none;flex-direction:column;align-items:center;gap:8px"><div class="spin"></div><div style="font-size:12px;color:#00a884">Generating...</div></div>
</div>

<textarea id="pr" placeholder="Prompt likho - Jo chaho - White suit me ladki darakht ke neeche bethi, real skin, photorealistic..."></textarea>

<button class="btn" onclick="gen()">Generate</button>
</div>

<button class="mic" id="mic">🎤</button>

<script>
let cur=null;
const di=document.getElementById('di');
const ph=document.getElementById('ph');
const sp=document.getElementById('sp');
const pr=document.getElementById('pr');

document.getElementById('gal').addEventListener('change',function(e){
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=function(ev){ ph.style.display='none'; sp.style.display='none'; di.style.display='block'; di.src=ev.target.result; cur=ev.target.result; };
 r.readAsDataURL(f);
});

async function gen(){
 const p=pr.value.trim();
 if(!p) return;
 ph.style.display='none'; di.style.display='none'; sp.style.display='flex';
 const enh=p + ", real skin, pores, photorealistic, no cartoon, no doll, no plastic, real human face, natural light, 16k";
 try{
  const url="https://image.pollinations.ai/prompt/"+encodeURIComponent(enh)+"?width=1024&height=1024&nologo=true&enhance=true&model=flux";
  const img=new Image();
  img.crossOrigin="anonymous";
  img.onload=function(){ sp.style.display='none'; di.style.display='block'; di.src=img.src; cur=img.src; };
  img.onerror=function(){ sp.style.display='none'; ph.style.display='block'; ph.innerText='Error - Phir try karo'; };
  img.src=url;
 }catch(e){ sp.style.display='none'; ph.style.display='block'; }
}

document.getElementById('mic').addEventListener('click', async function(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR) return;
 try{await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){return;}
 const rec=new SR(); rec.lang='ur-PK'; rec.interimResults=false;
 rec.onresult=function(e){ pr.value=e.results[0][0].transcript; };
 rec.start();
});
</script>
</body>
</html>
